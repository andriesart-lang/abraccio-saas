<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>A BRACCIO — Il braccio destro di chi lavora da solo</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/apple-style.css?v=3.1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
</head>
<body>

  <!-- Barra Superiore Glassmorphism -->
  <header class="navbar">
    <a href="#/" class="brand-badge">
      <img src="/static/icon-192.png" alt="A BRACCIO Logo" style="width: 34px; height: 34px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
      <span>A BRACCIO</span>
      <span id="user-plan-badge" class="badge-pro" style="display:none;">PRO</span>
    </a>

    <div class="nav-links" id="nav-actions">
      <!-- Dinamico: Login / Profilo -->
    </div>
  </header>

  <!-- Area Stampabile per PDF A4 -->
  <div id="print-area" style="display: none;"></div>

  <!-- Contenitore Principale -->
  <main class="container" id="app-root">
    <!-- Le Viste vengono renderizzate dinamicamente da app-saas.js -->
  </main>

  <!-- Modale Autenticazione (Login / Registrazione) -->
  <div id="auth-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 class="section-title" id="auth-title">Entra in A BRACCIO</h3>
      <p class="section-desc" id="auth-desc">Il braccio destro di chi lavora da solo.</p>

      <form id="auth-form">
        <div class="form-group" id="name-group" style="display: none;">
          <label class="form-label">Il tuo Nome / Studio</label>
          <input type="text" id="auth-name" class="form-input" placeholder="Es. Marco Rossi">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="auth-email" class="form-input" required placeholder="nome@esempio.it">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="auth-password" class="form-input" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-apple primary" id="auth-submit-btn">Accedi</button>
      </form>

      <div style="margin-top: 18px; text-align: center;">
        <button class="nav-btn" id="auth-toggle-mode">Non hai un account? Registrati gratis</button>
      </div>
      <div style="margin-top: 6px; text-align: center;">
        <button class="nav-btn" id="auth-close-btn" style="font-size: 0.8rem;">Chiudi</button>
      </div>
    </div>
  </div>

  <script src="/static/app-saas.js?v=3.1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (let reg of regs) {
            reg.update();
          }
        });
        navigator.serviceWorker.register('/static/sw.js?v=3.1').catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
